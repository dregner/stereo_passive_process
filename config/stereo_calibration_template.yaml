%YAML:1.0
---
# ============================================================================
# Stereo Calibration Template — passive_stereo_capture
# ============================================================================
# Format: OpenCV FileStorage (generated by cv::stereoCalibrate)
#
# Fill in values from your calibration tool (e.g., camera_calibration,
# kalibr, or the ROS camera_calibration package).
#
# Notes:
#   - image_width/image_height must match the NATIVE camera resolution
#     (before any resize or crop). Set binning=1 for full resolution.
#   - R and T describe the pose of the RIGHT camera w.r.t. the LEFT camera.
#   - T units are METRES.
#   - The node calls cv::stereoRectify() at startup and computes remap maps.
# ============================================================================

image_width:  2448
image_height: 2048

# --------------------------------------------------------------------------
# Left camera intrinsic matrix K1 (3x3)
#   [fx  0  cx]
#   [ 0 fy  cy]
#   [ 0  0   1]
# --------------------------------------------------------------------------
K1: !!opencv-matrix
  rows: 3
  cols: 3
  dt: d
  data: [ 1258.269, 0.0,      1218.789,
           0.0,     1250.487, 1055.300,
           0.0,     0.0,      1.0 ]

# --------------------------------------------------------------------------
# Left distortion coefficients D1 (1x5: k1, k2, p1, p2, k3)
# --------------------------------------------------------------------------
D1: !!opencv-matrix
  rows: 1
  cols: 5
  dt: d
  data: [ -0.21924125, 0.08416192, -0.00064082, 0.00056452, -0.01526585 ]

# --------------------------------------------------------------------------
# Right camera intrinsic matrix K2 (3x3)
# --------------------------------------------------------------------------
K2: !!opencv-matrix
  rows: 3
  cols: 3
  dt: d
  data: [ 1256.936, 0.0,      1240.880,
           0.0,     1251.410, 1051.302,
           0.0,     0.0,      1.0 ]

# --------------------------------------------------------------------------
# Right distortion coefficients D2 (1x5: k1, k2, p1, p2, k3)
# --------------------------------------------------------------------------
D2: !!opencv-matrix
  rows: 1
  cols: 5
  dt: d
  data: [ -0.21277361, 0.07863649, -0.00121804, -0.00022523, -0.01338277 ]

# --------------------------------------------------------------------------
# Rotation of RIGHT camera w.r.t. LEFT camera (3x3)
# From cv::stereoCalibrate output R matrix
# --------------------------------------------------------------------------
R: !!opencv-matrix
  rows: 3
  cols: 3
  dt: d
  data: [  0.999992314,  0.002626759, -0.002910775,
           -0.002611442,  0.999982791,  0.005253351,
            0.002924524, -0.005245709,  0.999981965 ]

# --------------------------------------------------------------------------
# Translation of RIGHT camera w.r.t. LEFT camera (3x1, METRES)
# From cv::stereoCalibrate output T vector
# --------------------------------------------------------------------------
T: !!opencv-matrix
  rows: 3
  cols: 1
  dt: d
  data: [ -0.214986119, 0.000723244, -0.002110624 ]
