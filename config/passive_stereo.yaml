passive_stereo_node:
  ros__parameters:
    # ---- Camera serials (match your BFS cameras) --------------------------
    cam_left_serial:  "23267854"
    cam_right_serial: "23267852"

    # ---- Acquisition settings -------------------------------------------
    frame_rate:         30.0
    exposure_time:      16667.0   # microseconds (1/30 s)
    gain:               0.0        # dB (used only when gain_auto=false)
    gain_auto:          false
    balance_white_auto: true
    binning:            1          # 1 = full native resolution

    # ---- Camera disconnect recovery --------------------------------------
    # Consecutive grab errors before triggering rclcpp::shutdown()
    max_consec_errors:  10

    # ---- Trigger mode ----------------------------------------------------
    # true  -> hardware trigger via Jetson GPIO PWM (camera Line3)
    # false -> free-running continuous acquisition
    trigger_mode:     false
    trigger_delay_us: 29

    # ---- Jetson GPIO for PWM trigger generation -------------------------
    # Jetson Orin Nano: line 85 = PN.01 (GPIO27) = trigger output
    # Run 'gpioinfo gpiochip0' to confirm pin assignments.
    gpio_chip: "gpiochip0"
    gpio_line: 85       # PN.01 = trigger line on Jetson Orin (NOT 106 which is laser)

    # ---- Stereo calibration ---------------------------------------------
    # OpenCV FileStorage YAML with K1, D1, K2, D2, R, T matrices.
    # See config/stereo_calibration_template.yaml for the format.
    calibration_file: "/home/daniel/ros2_ws/src/passive_stereo_capture/config/stereo_calibration_bfs.yaml"

    # ---- CLAHE (full-res Lab L-channel, for Retinify + Preview) ---------
    # SLAM receives raw rectified and applies its own grayscale CLAHE post-resize.
    clahe_clip_limit: 2.0
    clahe_tile_size:  8
    enable_clahe: false
    # ---- SLAM (ORB-SLAM3) ------------------------------------------------
    slam_enabled: true
    slam_voc_file: "/home/daniel/ros2_ws/src/orbslam3_ros2/orbslam3_ros2/vocabulary/ORBvoc.txt"
    slam_settings_file: "/home/daniel/ros2_ws/src/orbslam3_ros2/orbslam3_ros2/config/stereo_bluerov.yaml"
    slam_use_pangolin: false   # set true to open Pangolin viewer (needs X11)
    slam_scale_factor: 0.25     # 2448×2048 * 0.25 ≈ 612×512 — set 1.0 for full resolution
    slam_enu_publish: true
    slam_tf_publish:  false
    slam_cloud_hz:    2.0      # max rate to publish sparse map cloud (GetAllMapPoints is expensive)

    # ---- Coordinate frames -----------------------------------------------
    namespace:        "Passive"
    frame_id:         "map"
    parent_frame_id:  "base_link"
    child_frame_id:   "Passive/left_camera_link"

    # ---- Disparity (Retinify GPU) ----------------------------------------
    disparity_enabled: true
    depth_width:        0         # 0/0: native; e.g. 1600/1200 or 2448/2048 for load tests
    depth_height:       0
    disp_cloud_hz:      15.0
    disp_image_hz:      10.0
    depth_mode:       "accurate"   # "fast" | "balanced" | "accurate"
    max_dist:         15.0         # metres; 0 = no limit
    sampling_factor:  1.0          # point cloud decimation (0-1]: 0.5 = every other pixel
    crop_factor:      1.0          # central crop fraction (0-1]
    min_confidence:   0.35
    confidence_radius: 2
    confidence_alpha: 2.0
    publish_confidence: true
    disp_frame_id:    "Passive/left_camera_link"

    # ---- Preview streaming (unrectified raw perspective) ----------------
    preview_enabled: true
    preview_width:   720
    preview_height:  540
    preview_quality: 50    # JPEG quality 0-100
    preview_fps:     15.0  # Max publishing rate for preview (e.g. 10.0 Hz)
