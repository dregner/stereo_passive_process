passive_stereo_node:
  ros__parameters:
  # --- Camera parameters
    cam_left_serial: '23267854'
    cam_right_serial: '23267852'
    frame_rate: 30.0
    exposure_time: 166667.0
    gain: 0.0
    gain_auto: true
    balance_white_auto: true
    binning: 1

    color_correction_enabled: false
    color_ccm_left: [29.213605089775285, 2.336824461775791, 1.585608194477004, -14.19204788204803, 49.06405813320123, -0.3796234886228831, 0.6292478357080995, -15.627420591433975, 47.17331989883024]
    color_ccm_right: [32.414494347141044, 7.110613864250126, -0.5058262554192652, -19.071085585542164, 63.38834210343407, -4.772730831379022, -15.620491146197253, 3.8475047183801507, 49.60592500211055]
    # --- Stereo params
    calibration_file: /home/jetson/ros2_ws/src/stereo_passive_process/config/stereo_calibration_bfs.yaml
    clahe_clip_limit: 2.0
    clahe_tile_size: 8
    enable_clahe: false
    
    # --- Trigger mode
    trigger_mode: true
    trigger_source: Line2
    trigger_activation: RisingEdge
    max_consec_errors: 10
    sync_tolerance_ms: 25.0
    trigger_generator: pwm  # pwm: hardware peripheral; gpio: software timing; external: no generator
    pwm_chip: /sys/class/pwm/pwmchip2  # Verify device mapping on the Jetson; PWM5 / pin 33
    pwm_channel: 0
    pwm_duty_cycle_percent: 50.0  # Independent of camera exposure_time
    gpio_chip: gpiochip0
    gpio_line: 144


    # --- SLAM parameters
    slam_enabled: false
    slam_enu_publish: true
    slam_tf_publish: true
    slam_use_pangolin: false
    slam_voc_file: /home/jetson/ros2_ws/src/orbslam3_ros2/orbslam3_ros2/vocabulary/ORBvoc.txt
    slam_settings_file: /home/jetson/ros2_ws/src/stereo_passive_process/config/bfs_slam.yaml
    slam_scale_factor: 1.0
    slam_cloud_hz: 5.0
    # --- TF parameters
    namespace: Passive
    frame_id: map
    parent_frame_id: base_link
    child_frame_id: Passive/left_camera_link
    # --- Disparity parameters
    disparity_enabled: false
    disp_publish_cloud: true  # compressed color disparity only
    disparity_rectify_on_cpu: true # Retinify rectifies; OpenCV always rectifies
    disparity_backend: "retinify"  # retinify | stereobm | stereosgbm | stereobinary | cuda_sgm
    depth_mode:       "accurate"   # "fast" | "balanced" | "accurate"
    color_conversion_backend: "cpu"  # cpu | cuda (Bayer to RGB)
    stereo_cuda_p1: 10
    stereo_cuda_p2: 120  # must exceed P1; cuda_sgm search must be 64, 128 or 256
    stereo_min_disparity: 0
    stereo_num_disparities: 128
    stereo_block_size: 9
    stereo_uniqueness_ratio: 10
    stereo_speckle_window_size: 100
    stereo_speckle_range: 2
    stereo_disp12_max_diff: 1
    stereo_pre_filter_cap: 31
    stereo_texture_threshold: 10
    depth_process_hz: 10.0  # Bound background work; acquisition remains 30 Hz
    disparity_nice: 5      # Lower CPU priority than tracking on Linux
    depth_width:        0         # 0/0: native; e.g. 1600/1200 or 2448/2048 for load tests
    depth_height:       0
    disp_cloud_hz:      15.0
    disp_image_hz:      10.0
    max_dist:         15.0         # metres; 0 = no limit
    sampling_factor:  0.5         # point cloud decimation (0-1]: 0.5 = every other pixel
    crop_factor:      1.0         # central crop fraction (0-1]
    min_confidence:   0.35
    confidence_radius: 5
    confidence_alpha: 2.0
    publish_confidence: false
    disp_frame_id:    "Passive/left_camera_link"
    # --- Preview parameters
    preview_enabled: true
    preview_width: 720
    preview_height: 540
    preview_quality: 100
    preview_fps: 30.0
    depth_process_hz: 10.0
    disparity_nice: 5
