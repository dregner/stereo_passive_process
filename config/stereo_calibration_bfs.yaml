%YAML:1.0
---
# Stereo Calibration — passive_stereo_capture
# OpenCV FileStorage format. Use native, uncropped calibration images.
# image_width/image_height match the calibration images; use binning=1.
# K1/D1: LEFT camera; K2/D2: RIGHT camera.
# R/T are cv::stereoCalibrate outputs (X_right = R * X_left + T).
# T units: METRES (converted from calibration millimetres).
# The capture node computes rectification and remap maps at startup.

image_width: 720
image_height: 540

# Left camera intrinsic matrix
K1: !!opencv-matrix
  rows: 3
  cols: 3
  dt: d
  data: [ 901.2920473575226, 0.0, 374.2179357873948, 0.0, 905.5584933679969, 315.5591621371555, 0.0, 0.0, 1.0 ]

# Left distortion coefficients
D1: !!opencv-matrix
  rows: 1
  cols: 5
  dt: d
  data: [ -0.21346307694486086, 0.31286782700485694, 0.0008481823377484409, 7.804881735801128e-05, -0.7370332711534854 ]

# Right camera intrinsic matrix
K2: !!opencv-matrix
  rows: 3
  cols: 3
  dt: d
  data: [ 909.0139287214663, 0.0, 392.26029009490463, 0.0, 912.5439135113951, 324.7660804750595, 0.0, 0.0, 1.0 ]

# Right distortion coefficients
D2: !!opencv-matrix
  rows: 1
  cols: 5
  dt: d
  data: [ -0.2180282260396754, 0.39642113528812417, 0.0021391667146011322, 0.002217501906187732, -0.7406010994134762 ]

# Rotation from LEFT to RIGHT camera
R: !!opencv-matrix
  rows: 3
  cols: 3
  dt: d
  data: [ 0.9997549490083526, 0.01599485818013095, -0.015303804922425533, -0.016123126536339596, 0.9998356043993661, -0.008295117000216661, 0.015168609824217246, 0.008539829456821694, 0.9998484808153929 ]

# Translation from LEFT to RIGHT camera (METRES)
T: !!opencv-matrix
  rows: 3
  cols: 1
  dt: d
  data: [ -0.11953804873648562, 0.00025358089241263624, 0.0020344571171441194 ]