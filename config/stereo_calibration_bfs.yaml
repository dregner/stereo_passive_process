%YAML:1.0
---
# Stereo Calibration — passive_stereo_capture
# OpenCV FileStorage format. Use native, uncropped calibration images.
# image_width/image_height match the calibration images; use binning=1.
# K1/D1: LEFT camera; K2/D2: RIGHT camera.
# R/T are cv::stereoCalibrate outputs (X_right = R * X_left + T).
# T units: METRES (converted from calibration millimetres).
# The capture node computes rectification and remap maps at startup.

image_width: 720
image_height: 540

# Left camera intrinsic matrix
K1: !!opencv-matrix
  rows: 3
  cols: 3
  dt: d
  data: [ 917.505811, 0.000000, 364.837828, 0.000000, 916.454256, 257.696294, 0.000000, 0.000000, 1.000000 ]

# Left distortion coefficients
D1: !!opencv-matrix
  rows: 1
  cols: 5
  dt: d
  data: [ -0.207478, -0.025881, 0.000780, 0.003684, 0.974847 ]

# Right camera intrinsic matrix
K2: !!opencv-matrix
  rows: 3
  cols: 3
  dt: d
  data: [ 910.862416, 0.000000, 394.400053, 0.000000, 909.054274, 253.026588, 0.000000, 0.000000, 1.000000 ]

# Right distortion coefficients
D2: !!opencv-matrix
  rows: 1
  cols: 5
  dt: d
  data: [ -0.236496, 0.436817, -0.002469, 0.002078, -1.140501 ]

# Rotation from LEFT to RIGHT camera
R: !!opencv-matrix
  rows: 3
  cols: 3
  dt: d
  data: [ 0.999437, 0.015648, -0.029668, -0.015441, 0.999855, 0.007180, 0.029776, -0.006718, 0.999534 ]

# Translation from LEFT to RIGHT camera (METRES)
T: !!opencv-matrix
  rows: 3
  cols: 1
  dt: d
  data: [ -0.119013, -0.000359, -0.010753 ]
